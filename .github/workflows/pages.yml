# pages.yml — builds the site (every game and lab, a picture of each: tools/cards.ts, and the index page:
# tools/site.ts) and publishes it to the gh-pages branch; .github/publish.sh does the writing.
#   main            the live site at the root
#   a pull request  a preview at preview/<number>/, linked in a comment on it, replaced on each push, removed when it closes
# One-time setting: Settings → Pages → Build and deployment → Deploy from a branch → gh-pages, / (root).
name: pages
on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, closed]
  workflow_dispatch:
permissions:
  contents: write
  pull-requests: write
# one run per slot at a time: the live site, or one pull request's preview. Slots may write gh-pages side by side; each
# replaces only its own part, and publish.sh tries again when another slot's push beat its own. To 16 Nov 2026 there
# was one group for every run, and GitHub keeps only one run waiting in a group: a merge's push and its pull requests'
# close events, arriving together, cancelled each other, and ~40 closed pull requests' previews were never removed
# (docs/decisions.md, 27).
concurrency:
  group: pages-${{ github.event.pull_request.number || 'main' }}
  cancel-in-progress: false
jobs:
  publish:
    # a pull request from a fork has no token that can push: no preview for it
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    # the pictures take a minute or two under software WebGL (Rootshock and Tethys about 30 s each, 7 Nov 2026)
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          # the whole history: the index shows each game's last changes, and a preview what its pull request changed
          fetch-depth: 0
      - uses: actions/setup-node@v4
        if: github.event.action != 'closed'
        with:
          node-version: 22
          cache: npm
      - if: github.event.action != 'closed'
        run: |
          npm ci
          npm run build
      # a picture of each for the index; if this fails the site is still published, each card showing its name
      - name: card pictures (headless chromium, in the job only)
        if: github.event.action != 'closed'
        continue-on-error: true
        run: |
          npm i -g playwright@1.63.0
          npx playwright@1.63.0 install --with-deps chromium
          PLAYWRIGHT_MODULE="$(npm root -g)/playwright" node tools/cards.ts
      # Tethys's listening set (games/tethys/test/sound.js --dist, listen.html): rendered headless (~5 min, an mp3 each) only when something the
      # sound reads changed against the branch this goes into (or, on main, the commit before); otherwise main's live set is copied as it is,
      # in seconds. A rendered sound whose numbers are main's takes main's file, so gh-pages keeps one copy. If this fails the site is still
      # published, listen.html saying there is no set
      - name: tethys listening set (headless chromium, ffmpeg)
        if: github.event.action != 'closed'
        continue-on-error: true
        env:
          BASE: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || 'HEAD^' }}
          LIVE: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/games/tethys/listen/
        run: |
          T=games/tethys
          if git diff --quiet "$BASE"...HEAD -- $T/src $T/shell.html $T/vendor $T/test/sound.js $T/test/benchpage.js $T/test/spectro.js; then
            node $T/test/sound.js --dist $T/dist --from "$LIVE" --copy && exit 0
          fi
          command -v ffmpeg >/dev/null || (sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends ffmpeg)
          PLAYWRIGHT_MODULE="$(npm root -g)/playwright" node $T/test/sound.js --dist $T/dist --from "$LIVE"
      - if: github.event.action != 'closed'
        env:
          PREVIEW_PR: ${{ github.event.pull_request.number }}
          PREVIEW_BASE: ${{ github.base_ref && format('origin/{0}', github.base_ref) || '' }}
        run: node tools/site.ts
      - if: github.event_name != 'pull_request'
        run: bash .github/publish.sh main
      - if: github.event_name == 'pull_request' && github.event.action != 'closed'
        run: bash .github/publish.sh pr ${{ github.event.number }}
      - if: github.event_name == 'pull_request' && github.event.action == 'closed'
        run: bash .github/publish.sh close ${{ github.event.number }}
      - if: github.event_name == 'pull_request' && github.event.action == 'opened'
        uses: actions/github-script@v7
        with:
          script: |
            const {owner,repo}=context.repo;
            const url=`https://${owner.toLowerCase()}.github.io/${repo}/preview/${context.issue.number}/`;
            await github.rest.issues.createComment({owner,repo,issue_number:context.issue.number,body:`preview: ${url}\n\nEvery game and lab, built from this pull request. Updated on every push; removed when it closes. The first deploy takes a minute or two after this job.`});
