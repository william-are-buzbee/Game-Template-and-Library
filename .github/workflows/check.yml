# check.yml — on every pull request and on main: types, the tools' own tests, the catalog up to date, the workspaces'
# tests and browser tests (their "test" and "smoke" scripts), every workspace builds, every game and lab boots in
# headless Chromium with no page error (tools/look.ts --all), and the templates still make a game and a lab that work
# (tools/try-templates.ts).
# On a pull request the tests and browser tests are those of what it changed and of everything that uses that
# (tools/each.ts --changed; a change outside any workspace means all of them), and the templates are tried only if the
# tools, root config or a package changed; on main, always all of it.
# Run the same locally with `npm run check && npm run build && node tools/each.ts smoke --changed && npm run look -- --all`.
name: check
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    # Tethys's suite (node build.js --test: 19 runs, the ecology over game days among them) is most of it: 17 min on a
    # cloud session's machine, 6 Nov 2026
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          # the whole history, so a pull request can be compared with the branch it goes into
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: types, the tools' own tests, the catalog
        run: npm run typecheck && npm run test:tools && node tools/catalog.ts --check
      - name: tests (a pull request, what it changed and what uses it; main, everything)
        if: ${{ !cancelled() }}
        run: node tools/each.ts test ${{ github.event_name == 'pull_request' && format('--changed=origin/{0}', github.base_ref) || '' }}
      # the steps below run even when one above failed (the job still fails), so one red check cannot hide the others
      - run: npm run build
        if: ${{ !cancelled() }}
      - name: install headless chromium (in the job only, not the repo)
        if: ${{ !cancelled() }}
        run: |
          npm i -g playwright@1.63.0
          npx playwright@1.63.0 install --with-deps chromium
      - name: browser tests (each workspace's "smoke" script)
        if: ${{ !cancelled() }}
        run: PLAYWRIGHT_MODULE="$(npm root -g)/playwright" node tools/each.ts smoke ${{ github.event_name == 'pull_request' && format('--changed=origin/{0}', github.base_ref) || '' }}
      - name: every game and lab boots
        if: ${{ !cancelled() }}
        run: PLAYWRIGHT_MODULE="$(npm root -g)/playwright" node tools/look.ts --all
      - name: the templates make a game and a lab that work
        if: ${{ !cancelled() }}
        run: PLAYWRIGHT_MODULE="$(npm root -g)/playwright" node tools/try-templates.ts ${{ github.event_name == 'pull_request' && format('--changed=origin/{0}', github.base_ref) || '' }}
