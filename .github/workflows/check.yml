# check.yml — on every pull request and on main, in jobs that run side by side:
#   plan       which workspaces to check (tools/plan.ts): on a pull request, those it changed and everything that uses
#              them (a change outside any workspace means all of them); on main, all of them; and whether the templates
#              must be tried (the tools, root config or a package changed; on main, always)
#   <name>     one job per workspace in the plan, on a machine of its own: its tests, its build, its browser tests, and
#              for a game or lab its boot in headless Chromium (tools/look.ts). The pull request's checks name the game
#              that failed, and main takes as long as its slowest workspace
#   shared     the quick whole-repository checks: types, the tools' own tests, the catalog; and, when the plan says, that
#              the templates still make a game and a lab that work (tools/try-templates.ts)
#   all        passes only if all of the above did: the one check to require, if checks are ever required
# Locally: `npm run check && npm run build && node tools/each.ts smoke --changed && npm run look -- --all --no-shot`.
name: check
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
env:
  # on a pull request, compare with the branch it goes into; on main, nothing (everything runs)
  CHANGED: ${{ github.event_name == 'pull_request' && format('--changed=origin/{0}', github.base_ref) || '' }}
jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      any: ${{ steps.plan.outputs.any }}
      templates: ${{ steps.plan.outputs.templates }}
    steps:
      - uses: actions/checkout@v4
        with:
          # the whole history, so a pull request can be compared with the branch it goes into
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # the plan reads only package.json files and git: no install needed
      - id: plan
        run: node tools/plan.ts $CHANGED

  workspace:
    needs: plan
    if: ${{ needs.plan.outputs.any == 'true' }}
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    # Tethys's suite (node build.js --test, 19 runs) is the longest: 6-8 min since its runs went side by side (v11.93.3), 18 before
    timeout-minutes: 45
    strategy:
      # one game failing does not stop the others: each says for itself
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: test
        if: ${{ matrix.test }}
        run: npm run test -w ${{ matrix.dir }}
      # the steps below run even when one above failed (the job still fails), so one red step cannot hide the others
      - name: build
        if: ${{ matrix.build && !cancelled() }}
        run: npm run build -w ${{ matrix.dir }}
      - name: install headless chromium (in the job only, not the repo)
        if: ${{ (matrix.smoke || matrix.boot) && !cancelled() }}
        run: |
          npm i -g playwright@1.63.0
          npx playwright@1.63.0 install --with-deps chromium
      - name: browser tests
        if: ${{ matrix.smoke && !cancelled() }}
        run: PLAYWRIGHT_MODULE="$(npm root -g)/playwright" npm run smoke -w ${{ matrix.dir }}
      - name: boots with no page error
        if: ${{ matrix.boot && !cancelled() }}
        run: PLAYWRIGHT_MODULE="$(npm root -g)/playwright" node tools/look.ts ${{ matrix.dir }} --no-shot

  shared:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: types, the tools' own tests, the catalog
        run: npm run typecheck && npm run test:tools && node tools/catalog.ts --check
      - name: install headless chromium (in the job only, not the repo)
        if: ${{ needs.plan.outputs.templates == 'true' && !cancelled() }}
        run: |
          npm i -g playwright@1.63.0
          npx playwright@1.63.0 install --with-deps chromium
      - name: the templates make a game and a lab that work
        if: ${{ needs.plan.outputs.templates == 'true' && !cancelled() }}
        run: PLAYWRIGHT_MODULE="$(npm root -g)/playwright" node tools/try-templates.ts

  all:
    needs: [plan, workspace, shared]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: every job passed (a workspace job skipped because nothing needed testing counts as passed)
        run: |
          echo "plan: ${{ needs.plan.result }}  workspaces: ${{ needs.workspace.result }}  shared: ${{ needs.shared.result }}"
          test "${{ needs.plan.result }}" = success
          test "${{ needs.shared.result }}" = success
          test "${{ needs.workspace.result }}" = success -o "${{ needs.workspace.result }}" = skipped
