<script type="module">

const hex = c => Array.isArray(c) ? c : [((c >> 16) & 255) / 255, ((c >> 8) & 255) / 255, (c & 255) / 255];

/* a cut-down copy of the game's look (shader.ts): faceted, shaded by facing, a room light, the flashlight from the eye,

const VS = `attribute vec3 aCol; varying vec3 vW; varying vec3 vC;
void main(){ vec4 w = modelMatrix * vec4(position, 1.0); vW = w.xyz; vC = aCol; gl_Position = projectionMatrix * viewMatrix * w; }`;
const FS = `uniform vec3 uRoom; uniform vec3 uFlashPos; uniform vec3 uFlashDir; uniform float uFlash;
uniform vec3 uGlowPos; uniform vec3 uGlowC; uniform float uGlowR; uniform vec4 uTint; uniform float uTime; uniform float uFog;
varying vec3 vW; varying vec3 vC;
void main(){

  vec3 nf = dot(n, Ld) < 0.0 ? -n : n;
  vec3 base = vC; float em = 0.0;
  if (base.r > 1.5) { base -= 2.0; em = 1.0; }
  base = mix(base, uTint.rgb, uTint.a);
  float sh = 0.55 + 0.45 * (abs(nf.y) * 0.95 + abs(nf.x) * 0.7 + abs(nf.z) * 0.5);
  vec3 light = uRoom * sh * (0.75 + 0.25 * max(nf.y, 0.0));
  vec3 tp = vW - uFlashPos; float fd = length(tp); vec3 fdir = tp / max(fd, 0.001);
  float cone = smoothstep(0.88, 0.975, dot(fdir, uFlashDir));

  light += uFlash * vec3(1.0, 0.94, 0.82) * (cone * 2.5 + 0.05) * facing / (1.0 + 0.09 * fd * fd);

  light += vec3(0.014) / (1.0 + 3.0 * d * d);

  h3 += dot(h3, h3.yzx + 33.33);
  c += (fract((h3.x + h3.y) * h3.z) - 0.5) * 0.024 * (1.0 - smoothstep(0.0, 0.35, dot(c, vec3(0.3, 0.59, 0.11))));

const U = {
  uRoom: { value: new THREE.Vector3() }, uFlashPos: { value: new THREE.Vector3() }, uFlashDir: { value: new THREE.Vector3(0, 0, -1) }, uFlash: { value: 1 },

const MAT = material();

function mk(parent, shape, c, sx, sy, sz, x, y, z, mat = MAT) {
  const m = new THREE.Mesh(geo(shape, c, sx, sy, sz), mat);

/** a box from a to b (world or parent frame), w by h across */

const V = (x, y, z) => new THREE.Vector3(x, y, z);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;
const damp = (k, dt) => 1 - Math.exp(-k * dt);

const smooth = (a, b, x) => ease(clamp((x - a) / (b - a), 0, 1));

/* ---------------------------------------------------------------------------------------------------------------- */
/* eyes: a ball that turns in its socket to look. No lids, as the cast have none: a blink squeezes the ball flat, and an
   eye that is shut is rolled back, white */
const EYES = [];
function eye(parent, r, x, y, z, o = {}) {

  const sc = new THREE.Mesh(geo('ico', SCL, r * 2, r * 2, r * 2), scm); sc.frustumCulled = false; ball.add(sc);

}
const _v = new THREE.Vector3(), _w = new THREE.Vector3(), _e = new THREE.Vector3();
/** the yaw and pitch, in o's parent's frame, that turn o's +z at t */
function aim(o, t) {

/** each frame: turn toward t, blink, bulge when staring, roll back when shut, pupils by the light */
function lookEye(E, t, dt, mood) {

  const jit = E.wild && mood.stare < 0.5 && Math.random() < 0.02 ? rnd(-0.3, 0.3) : 0;
  E.roll += ((mood.shut ? 1 : 0) - E.roll) * damp(5, dt);
  E.ball.rotation.set(lerp(E.pitch, -1.5, E.roll), E.yaw * (1 - E.roll) + jit, 0);
  if ((E.blink -= dt) < 0 && mood.stare < 0.5 && !mood.shut) { E.blink = rnd(2, 7); E.shut = 0.16; }

  E.ball.scale.set(E.sq, E.sq * (1 - 0.85 * blinking), E.sq);

     its beam, by how near and how square in it. Fear opens it; looking at something close narrows it; it never quite
     holds still. It closes quickly and opens slowly */

/* ---------------------------------------------------------------------------------------------------------------- */
/* sound: a knock is a thud through concrete; the building rings a little after it */
let ac = null, master = null, noise = null;

/* the knock code: a zone's count, a pause, the count again */
const ZONES = { wing: ['The wing', 1], atrium: ['The atrium', 2], muster: ['The muster hall', 3], ops: ['Operations', 4] };
function codeTimes(n) {
  const out = []; let t = 0;

  return out;
}
const knocksEl = document.getElementById('knocks');
function showKnocks(n, landed, name) {
  if (!n) { knocksEl.innerHTML = ''; return; }
  let h = name ? `${name} ` : '';
  for (let k = 0; k < 2 * n; k++) h += (k === n ? '<i class="gap"></i>' : '') + `<i class="${k < landed ? 'on' : ''}"></i>`;

/* ---------------------------------------------------------------------------------------------------------------- */
/* a person for scale: 1.8 m */
function figure(parent, x, z, yaw) {
  const g = grp(parent, x, 0, z), c = 0x5c5f62;
  g.rotation.y = yaw;
  for (const s of [-1, 1]) mk(g, 'box', c, 0.16, 0.86, 0.18, s * 0.11, 0.43, 0);
  mk(g, 'box', c, 0.44, 0.62, 0.24, 0, 1.17, 0);
  for (const s of [-1, 1]) mk(g, 'box', c, 0.1, 0.66, 0.11, s * 0.28, 1.15, 0);

function floor(parent, w, d, c, line, step) {

  for (let z = -d / 2 + step; z < d / 2; z += step) mk(parent, 'box', line, w, 0.004, 0.02, 0, 0.001, z);

/* ================================================================================================================ */
/* THE OVERSEER: the operations staff grown into one body at their posts. A mound of them fused, a head that has
   budded three more like a tumour buds, and every face turns together to whatever it
   attends to. A watcher at each screen behind it, joined to it by a cord of meat; two clubbed arms to knock with. */
function buildOverseer() {
  const S = new THREE.Scene(), body = grp(S, 0, 0, 0);
  /* the room: floor, the back wall and its desk of screens, the glass onto the hall in front */
  floor(S, 12, 11, 0x303336, 0x232629, 1.2);
  mk(S, 'box', 0x262a2e, 12, 4.2, 0.2, 0, 2.1, -4.75);
  mk(S, 'box', 0x3a3d40, 9.2, 0.06, 0.72, 0, 0.75, -4.12);
  mk(S, 'box', 0x24272a, 9.2, 0.7, 0.05, 0, 0.37, -3.78);
  mk(S, 'box', 0x2a2d30, 12, 0.92, 0.3, 0, 0.46, 3.3);
  for (let x = -4.8; x <= 4.81; x += 1.6) mk(S, 'box', RIM, 0.09, 3.1, 0.12, x, 2.47, 3.3);

  for (const s of [-1, 1]) {

    for (let k = 0; k < 5; k++) { const m = mk(S, 'box', 0x141516, 0.6 + k * 0.08, 0.008, 0.025, s * 1.38, 0.006, 1.42); m.rotation.y = k * 1.26 + s; m.position.x += Math.cos(k * 1.26 + s) * 0.35 * s; m.position.z -= Math.sin(k * 1.26 + s) * 0.35; }

  knock: ['Knocked for', 'Three knocks, a pause, three: the muster hall. On each one its feet and hands press down. When the code is done the tail comes up over its back, the head on the end rolls its eyes down, and it goes.'],
  alert: ['Raised', 'The body lifts on its four. The four legs at the front work back and forth two and two, knees up and feet just off the floor. The tail comes up over its back, its arms held as a person holds them: hanging at its sides, elbows back, forearms bent forward and the hands drooping.'],
  go: ['Going', 'Raised, on its way. It walks on the body\'s four, diagonal pairs together, the tail up and its eye on what is ahead.'],

function setHand(mode) {

/** a footfall, so a foot stays where it was put. u runs 0..1 round the gait: for the first 0.62 the foot is down, on

/* ---- the panel ---- */

const flashEl = document.getElementById('flash'), figEl = document.getElementById('figure');
addEventListener('keydown', e => { if (e.key === 'f' || e.key === 'F') flashEl.checked = !flashEl.checked; });

/* ---- orbit ---- */

addEventListener('resize', resize); resize();

let prev = performance.now();
const FOLLOW = new THREE.Vector3();
