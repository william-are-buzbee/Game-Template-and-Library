/** a box standing on o.y (as the level's bx does), its middle at (x, z) */

/* ---------- rock: shells dug as the station's caverns are, sprayed and lumpy, seen from inside ---------- */

  mesh(mat) { const g = new THREE.BufferGeometry(); g.setAttribute('position', new THREE.Float32BufferAttribute(this.p, 3)); g.setAttribute('color', new THREE.Float32BufferAttribute(this.c, 3)); g.computeVertexNormals(); return new THREE.Mesh(g, mat); } }

function rockCol(p, base) {

/** a grid of quads: at(i, j) places a vertex ({p, n: the side it is seen from, d: how far from the surface's edge});

function grid(nu, nv, at, cell, amp, base) {

function face(T, a, b, c, n) {
